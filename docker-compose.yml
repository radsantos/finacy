services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - finance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finance-backend
    command: >
      sh -c "
      pnpm prisma migrate deploy &&
      pnpm dev
      "
    environment:
      DATABASE_URL: postgresql://finance:finance@db:5432/finance
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  finance_postgres_data: